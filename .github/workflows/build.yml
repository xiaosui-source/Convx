name: Android Build Workflow

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STORE_PASSWORD: Abc123456789@xyz
  KEY_ALIAS: auto_key
  KEY_PASSWORD: Abc123456789@xyz

jobs:
  Release_Build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Convx 编译要求 Java 21 (sourceCompatibility/targetCompatibility = VERSION_21)
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 缓存 Android SDK 组件(platforms/build-tools), 避免每次重新下载 compileSdk 平台
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_HOME }}/ndk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      # 缓存 Gradle 依赖与 wrapper, 加快后续构建
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      # 生成 release keystore。build.gradle.kts 中 file("keystore/release.keystore")
      # 相对于 :app 模块目录, 即 app/keystore/release.keystore。
      # keystore/ 已被 .gitignore 忽略, 不会提交回仓库, 每次构建在工作区重新生成
      - name: Generate Release Keystore
        run: |
          mkdir -p app/keystore
          if [ ! -f "app/keystore/release.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "app/keystore/release.keystore" \
              -alias "${{ env.KEY_ALIAS }}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${{ env.STORE_PASSWORD }}" \
              -keypass "${{ env.KEY_PASSWORD }}" \
              -dname "CN=Android App,OU=Dev,O=Company,L=City,ST=Province,C=CN"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        # Convx 有 flavor 矩阵 (universal/arm64/... x foss/gms), 排除具体变体的
        # lintVital 任务, 避免歧义任务名 (lintVitalRelease) 导致构建失败
        run: ./gradlew assembleUniversalGmsRelease -x lint -x lintVitalUniversalGmsRelease --no-configuration-cache --console=plain --max-workers=4
        env:
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Release-APK
          path: app/build/outputs/apk/universalGms/release/*.apk
